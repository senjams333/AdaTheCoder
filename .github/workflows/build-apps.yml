# Builds Ada The Coder for every device on GitHub's own machines:
#   Windows installer (.exe) · Mac disk image (.dmg, every MacBook, macOS 11+) · Android app (.apk + .aab)
#   iPhone & iPad app (a simulator build always; with Apple keys also uploaded to TestFlight)
#
# Start it: GitHub → Actions → "Build apps" → Run workflow (choose the branch), or push a tag like v1.5.2.
# Download the files from the run's "Artifacts" (or the Release made for a tag) and upload them in the website
# admin → App versions.
#
# Optional secrets (GitHub → Settings → Secrets and variables → Actions). Without them everything still builds:
#   Windows signing (SSL.com eSigner): ES_USERNAME, ES_PASSWORD, ES_TOTP_SECRET
#   Android signing key (keep the same one for ever, the Play Store needs it):
#       ANDROID_KEYSTORE_BASE64 (base64 of android.keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
#       (without them: a throwaway test key, fine for trying the APK on your own phone)
#   iOS upload to TestFlight: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (App Store Connect API key)
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  SITE: https://www.adathecoder.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test the app
        working-directory: desktop_app
        run: python -m unittest discover tests

  # ---------------------------------------------------------------- Windows
  windows:
    needs: test
    runs-on: windows-latest
    env:
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Inno Setup (makes the installer)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        working-directory: desktop_app
        shell: cmd
        run: build_windows.bat %SITE%
      - name: Sign with SSL.com eSigner (only with the ES_* secrets)
        if: ${{ env.ES_USERNAME != '' }}
        env:
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile CodeSignTool.zip
          Expand-Archive CodeSignTool.zip -DestinationPath C:\CodeSignTool -Force
          $exe = Get-ChildItem desktop_app\dist\AdaTheCoder-*-Windows-Setup.exe | Select-Object -First 1
          $tool = Get-ChildItem C:\CodeSignTool -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          Push-Location $tool.DirectoryName
          .\CodeSignTool.bat sign -username="$env:ES_USERNAME" -password="$env:ES_PASSWORD" -totp_secret="$env:ES_TOTP_SECRET" -input_file_path="$($exe.FullName)" -output_dir_path="$env:GITHUB_WORKSPACE\signed"
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE\signed\$($exe.Name)" $exe.FullName -Force
          (Get-AuthenticodeSignature $exe.FullName).Status
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-Windows
          path: |
            desktop_app/dist/AdaTheCoder-*-Windows-Setup.exe
            desktop_app/dist/AdaTheCoder-*-Windows.zip

  # ---------------------------------------------------------------- macOS (every MacBook: an Intel app, Apple chips run it through Rosetta)
  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: "Rosetta and Python 3.11 from python.org (universal2, runs as Intel under Rosetta)"
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg py.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"
      - name: Build disk image
        working-directory: desktop_app
        run: bash build_mac.sh "$SITE"
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-Mac
          path: desktop_app/dist/AdaTheCoder-*-Mac.dmg

  # ---------------------------------------------------------------- Android (Trusted Web Activity, mobile/android)
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ada-upload-key.keystore
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway test key (fine for trying the APK; not for the Play Store)."
            keytool -genkeypair -keystore ada-upload-key.keystore -alias ada -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass testtest -keypass testtest -dname "CN=Ada The Coder test, O=Ada The Coder, C=IN"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=testtest" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=testtest" >> "$GITHUB_ENV"
          fi
      - name: Build APK and App Bundle
        working-directory: mobile/android
        run: |
          # the icons from this repository (the website may not have them yet)
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/web/public/icons"
          sed -i "s#https://www.adathecoder.com/icons/#${RAW}/#g" twa-manifest.json
          yes "" | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          bubblewrap build --skipPwaValidation
          bubblewrap fingerprint generateAssetLinks || true
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-Android
          path: |
            mobile/android/app-release-signed.apk
            mobile/android/app-release-bundle.aab
            mobile/android/assetlinks.json

  # ---------------------------------------------------------------- iPhone & iPad (Capacitor, mobile/ios)
  ios:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Make the Xcode project
        working-directory: mobile/ios
        run: |
          npm install
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          bash finish-ios.sh
      - name: Build for the iPhone/iPad simulator (checks that it builds)
        working-directory: mobile/ios
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/AdaTheCoder-iOS-Simulator.zip" App.app
      - name: Upload to TestFlight (only with the Apple secrets)
        if: ${{ env.ASC_KEY_ID != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        working-directory: mobile/ios
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/key.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/key.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/AdaTheCoder.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${AUTH[@]}" archive | tail -5
          sed "s/YOUR_TEAM_ID/$APPLE_TEAM_ID/" ExportOptions-testflight.plist > "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive -archivePath build/AdaTheCoder.xcarchive -exportPath build/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" "${AUTH[@]}" | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-iOS-Simulator
          path: AdaTheCoder-iOS-Simulator.zip

  # ---------------------------------------------------------------- a GitHub Release with every file (for a v* tag)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, android, ios]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: files/*
