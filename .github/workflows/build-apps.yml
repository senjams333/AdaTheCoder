# Builds Ada The Coder for every device on GitHub's own machines:
#   Windows installer (.exe) · Mac disk image (.dmg, every MacBook, macOS 11+)
#   Android app (.apk) and iPhone & iPad app (unsigned) from the Flutter app in flutter_app/
#
# Start it: GitHub → Actions → "Build apps" → Run workflow (choose the branch), or push a tag like v1.5.2.
# Download the files from the run's "Artifacts" (or the Release made for a tag) and upload them in the website
# admin → App versions.
#
# Optional secrets (GitHub → Settings → Secrets and variables → Actions). Without them everything still builds:
#   Windows signing (SSL.com eSigner): ES_USERNAME, ES_PASSWORD, ES_TOTP_SECRET
#   (Android and iOS signing for the Play Store / App Store come later.)
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      only:
        description: "Which app to build"
        type: choice
        options: [all, windows, mac, android, ios]
        default: all

env:
  SITE: https://www.adathecoder.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test the app
        working-directory: desktop_app
        run: python -m unittest discover tests

  # ---------------------------------------------------------------- Windows
  windows:
    needs: test
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'windows' }}
    runs-on: windows-latest
    env:
      ES_USERNAME: ${{ secrets.ES_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Inno Setup (makes the installer)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        working-directory: desktop_app
        shell: cmd
        run: build_windows.bat %SITE%
      - name: Sign with SSL.com eSigner (only with the ES_* secrets)
        if: ${{ env.ES_USERNAME != '' }}
        env:
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.ssl.com/download/codesigntool-for-windows/" -OutFile CodeSignTool.zip
          Expand-Archive CodeSignTool.zip -DestinationPath C:\CodeSignTool -Force
          $exe = Get-ChildItem desktop_app\dist\AdaTheCoder-*-Windows-Setup.exe | Select-Object -First 1
          $tool = Get-ChildItem C:\CodeSignTool -Recurse -Filter CodeSignTool.bat | Select-Object -First 1
          Push-Location $tool.DirectoryName
          .\CodeSignTool.bat sign -username="$env:ES_USERNAME" -password="$env:ES_PASSWORD" -totp_secret="$env:ES_TOTP_SECRET" -input_file_path="$($exe.FullName)" -output_dir_path="$env:GITHUB_WORKSPACE\signed"
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE\signed\$($exe.Name)" $exe.FullName -Force
          (Get-AuthenticodeSignature $exe.FullName).Status
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-Windows
          path: |
            desktop_app/dist/AdaTheCoder-*-Windows-Setup.exe
            desktop_app/dist/AdaTheCoder-*-Windows.zip

  # ---------------------------------------------------------------- macOS (every MacBook: an Intel app, Apple chips run it through Rosetta)
  mac:
    needs: test
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'mac' }}
    runs-on: macos-15-intel     # an Intel Mac: the app is an Intel app (Apple chips run it through Rosetta)
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: "Rosetta and Python 3.11 from python.org (universal2, runs as Intel under Rosetta)"
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg py.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "$GITHUB_PATH"
      - name: Build disk image
        working-directory: desktop_app
        run: bash build_mac.sh "$SITE"
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-Mac
          path: desktop_app/dist/AdaTheCoder-*-Mac.dmg

  # ---------------------------------------------------------------- Android (Flutter: flutter_app/)
  android:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'android' }}
    runs-on: ubuntu-latest
    permissions: { contents: write }      # to keep the generated android/ and ios/ folders in the repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Put the app inside (screens, Python, pictures) and make the Android/iOS folders
        run: bash flutter_app/tool/prepare.sh
      - name: Keep the new android/ and ios/ folders in the repository (first time only)
        if: ${{ github.ref_type == 'branch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/android flutter_app/ios flutter_app/analysis_options.yaml flutter_app/.metadata flutter_app/README.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Flutter app: the android/ and ios/ folders (made by flutter create, set up by tool/prepare.sh)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build the Android app (APK)
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Name it
        run: cp flutter_app/build/app/outputs/flutter-apk/app-release.apk AdaTheCoder-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-Android
          path: AdaTheCoder-Android.apk

  # ---------------------------------------------------------------- iPhone & iPad (Flutter: flutter_app/)
  ios:
    if: ${{ github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'ios' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Put the app inside (screens, Python, pictures), set up the iOS folder
        run: bash flutter_app/tool/prepare.sh
      - name: Build the iPhone/iPad app (not signed; signing needs your Apple Developer account)
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign
      - name: Pack it
        run: cd flutter_app/build/ios/iphoneos && zip -qr "$GITHUB_WORKSPACE/AdaTheCoder-iOS-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: AdaTheCoder-iOS-unsigned
          path: AdaTheCoder-iOS-unsigned.zip

  # ---------------------------------------------------------------- a GitHub Release with every file (for a v* tag)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, android, ios]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: files/*
