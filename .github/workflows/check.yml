# Checks every push: type-checks and builds the API and the website, and runs the tests.
# Problems show up as annotations on the run (file and line), and the run turns red.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: |
          set -o pipefail
          npx tsc --noEmit -p tsconfig.json --pretty false 2>&1 | tee tsc.txt || {
            sed -nE 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$/::error file=api\/\1,line=\2,col=\3::\4 \5/p' tsc.txt
            exit 1
          }
      - name: Build
        run: npm run build
      - name: Tests (in-memory database, no emails sent)
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee jest.txt || {
            # the whole failure report as one note (new lines encoded the way GitHub expects)
            msg=$(awk '/●/{f=1} f' jest.txt | head -150 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=API tests::${msg}"
            exit 1
          }

  web:
    name: Website (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee tsc.txt || {
            sed -nE 's/^([^(]+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$/::error file=web\/\1,line=\2,col=\3::\4 \5/p' tsc.txt
            exit 1
          }
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.txt || {
            msg=$(tail -80 build.txt | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Website build::${msg}"
            exit 1
          }

  desktop:
    name: Desktop app (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: desktop_app
        run: python -m unittest discover tests
      - name: Theme pack examples print what the lessons say
        run: python themes/check_examples.py themes

  apps:
    name: Kids apps (engine, lesson locks, duplicating)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (locks, licence keys, app folders, duplicating)
        run: python -m unittest discover apps/tests -v
      - name: Every app is ready to build
        run: |
          for a in apps/*/app.json; do python apps/build.py "$(basename "$(dirname "$a")")" --check; done
      - name: Install PyQt5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2t64 libpulse0 fonts-noto-color-emoji \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          pip install -r apps/requirements.txt
      - name: Open each app and go through it (screenshots)
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: |
          for a in apps/*/app.json; do
            a="$(basename "$(dirname "$a")")"
            python apps/make_key.py "$a" > /dev/null
            timeout 300 python apps/tests/smoke_gui.py "$a" "$RUNNER_TEMP/app-shots" 2>&1 | tee -a smoke.txt
          done
          echo "::notice title=Apps::$(grep -c '^PASS' smoke.txt) steps passed"
      - name: Save the screenshots (ci-app-previews branch)
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d "$RUNNER_TEMP/app-shots" ] || exit 0
          cd "$RUNNER_TEMP/app-shots"
          git init -q && git checkout -q -b ci-app-previews
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "Screenshots of the kids apps from commit $GITHUB_SHA" > README.md
          git add -A && git commit -q -m "App screenshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-app-previews

  e2e:
    name: End-to-end (MySQL + API + website in a browser)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: admin_db
          MYSQL_USER: Admin
          MYSQL_PASSWORD: ci-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: Admin
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-secret
      SITE_URL: http://127.0.0.1:5000
      API_PUBLIC_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000/api
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          (cd api && npm install --no-audit --no-fund)
          (cd web && npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.48.2)
          (cd web && npx playwright install --with-deps chromium)
      - name: API tests on MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -proot-ci -e "CREATE DATABASE admin_test; GRANT ALL ON admin_test.* TO 'Admin'@'%';"
          cd api
          set -o pipefail
          TEST_DB=mysql DB_NAME=admin_test npm run test:e2e 2>&1 | tee jest.txt || {
            msg=$(awk '/●/{f=1} f' jest.txt | head -150 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=API tests on MySQL::${msg}"
            exit 1
          }
      - name: Start the API (MySQL admin_db)
        run: |
          cd api && npm run build
          DB_NAME=admin_db nohup node dist/main > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:3000/api/health | grep -q '"ok":true' && exit 0; sleep 1; done
          msg=$(tail -60 ../api.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g'); echo "::error title=API didn't start::${msg}"; exit 1
      - name: Load the sample theme pack (npm run theme -- import)
        run: |
          cd api
          DB_NAME=admin_db node dist/cli/theme-pack.js import ../themes/space
          curl -s http://127.0.0.1:3000/api/v3/courses | grep -q '"Learn Coding in Space"' || { echo "::error title=Theme pack::space theme not in /api/v3/courses"; exit 1; }
      - name: Build and start the website
        run: |
          cd web && npm run build
          nohup npx next start -p 5000 -H 127.0.0.1 > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:5000 && exit 0; sleep 1; done
          echo "::error title=Website didn't start::$(tail -40 ../web.log | tr '\n' ' ')"; exit 1
      - name: Click through the website and admin
        run: |
          cd web
          set -o pipefail
          node e2e/smoke.mjs http://127.0.0.1:5000 http://127.0.0.1:3000/api 2>&1 | tee smoke.txt || {
            msg=$(grep -A3 '^FAIL' smoke.txt | head -120 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Browser check::${msg}"
            msg=$(tail -40 ../api.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g'); echo "::warning title=API log::${msg}"
            exit 1
          }
          echo "::notice title=Browser check::$(grep -c '^PASS' smoke.txt) steps passed"
      - name: Screenshots of every page (saved to the ci-previews branch)
        if: github.event_name != 'pull_request'
        run: |
          cd web
          node e2e/screens.mjs http://127.0.0.1:5000 http://127.0.0.1:3000/api "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP/shots"
          git init -q && git checkout -q -b ci-previews
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "Screenshots of the website from commit $GITHUB_SHA" > README.md
          git add -A && git commit -q -m "Screenshots for $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-previews
