<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ada The Coder</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bae6fd; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; visibility: hidden; background: #bae6fd; }
  #wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
          color: #1e1b4b; text-align: center; padding: 20px; }
  #wait img { width: 120px; height: 120px; object-fit: contain; }
  #wait b { font-size: 1.3rem; }
  #wait small { color: #475569; max-width: 460px; }
  .bar { width: 220px; height: 10px; border-radius: 10px; background: #e0f2fe; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 10px; background: #38bdf8; animation: go 1.2s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <iframe id="app" title="Ada The Coder" allow="autoplay; fullscreen"></iframe>
  <div id="wait"><img src="/appweb/assets/images/ada_logo.png" alt=""><b>Getting Ada The Coder ready…</b><span class="bar"><i></i></span>
    <small>The first time takes a little longer.</small></div>
  <script src="/shell.js"></script>
</body>
</html>
