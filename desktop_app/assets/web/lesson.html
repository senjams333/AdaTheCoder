<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada The Coder lesson</title>
<link rel="stylesheet" href="lesson.css">
<!-- Present inside the app; harmless when the page is opened in a normal browser. -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="moon"></div>
    <span class="star s1">⭐</span><span class="star s2">✨</span><span class="star s3">⭐</span><span class="star s4">✨</span><span class="star s5">⭐</span>
  </div>

  <header class="lesson-head">
    <span class="lesson-badge" id="lessonBadge">Lesson 1</span>
    <h1 id="lessonTitle">PYTHON ADVENTURE 🐍✨</h1>
    <p class="subtitle" id="pageSubtitle">Learn Python with your coding friends! 🚀</p>
  </header>

  <main class="workspace">
    <section class="panel examples" aria-labelledby="examplesTitle">
      <h2 class="panel-title" id="examplesTitle">✨ Try an example</h2>
      <div class="example-list" id="exampleList"></div>

      <div class="tutorial-overlay" id="tutorialOverlay" role="status">
        <div class="guide">
          <span class="sparkle sp1">⭐</span><span class="sparkle sp2">✨</span>
          <span class="sparkle sp3">🌟</span><span class="sparkle sp4">⭐</span>
          <img id="guideImg" src="../images/ada.png" alt="">
        </div>
        <p class="bubble">Click an example to start! 🚀</p>
      </div>
    </section>

    <section class="panel editor" aria-label="Code editor">
      <div class="editor-bar">
        <span class="file-tab">🐍 my_code.py</span>
        <span class="bar-gap"></span>
        <button class="tool-btn" id="resetBtn" type="button" title="Put the starting code back">↺ Reset</button>
        <button class="tool-btn stop" id="stopBtn" type="button" hidden>⏹ Stop</button>
        <button class="run-btn" id="runBtn" type="button" title="Run your code (Ctrl + Enter)">▶ RUN</button>
      </div>

      <div class="code-wrap" id="codeWrap">
        <pre class="gutter" id="gutter" aria-hidden="true">1</pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Your Python code"># Write code below 💻
print("Hello Kids! 👋")</textarea>
      </div>
      <p class="hint-line">Tip: press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run · <kbd>Tab</kbd> adds 4 spaces</p>

      <div class="output-head">
        <span>🖥️ Output</span>
        <button class="link-btn" id="clearBtn" type="button">Clear</button>
      </div>
      <div class="output" id="output" aria-live="polite"></div>

      <div class="error-card" id="errorCard" hidden>
        <img id="errorImg" src="../images/tom.png" alt="">
        <div>
          <p class="error-title" id="errorTitle">Oopsie! 🙈</p>
          <p class="error-hint" id="errorHint"></p>
        </div>
      </div>
    </section>
  </main>

  <div class="celebrate" id="celebrate" role="status">
    <div class="celebrate-card">
      <img id="successImg" src="../images/teddy.png" alt="">
      <p class="celebrate-text">🎉 Fantastic job! 🌟</p>
    </div>
  </div>

  <script src="lesson.js"></script>
<script>
/* Windows' built-in web engine (Qt 5.15.2, Chromium 83) ignores "gap" in flex layouts. There, the items get the same
   space as margins instead. Newer engines (Ubuntu, Mac) support gap, so this does nothing there. */
(function () {
  function supported() {
    try {
      var t = document.createElement("div");
      t.style.cssText = "display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden";
      t.appendChild(document.createElement("div")); t.appendChild(document.createElement("div"));
      document.body.appendChild(t);
      var ok = t.scrollHeight === 1;
      document.body.removeChild(t);
      return ok;
    } catch (e) { return true; }
  }
  function fix() {
    var all = document.body.getElementsByTagName("*");
    for (var i = 0; i < all.length; i++) {
      var el = all[i], cs = getComputedStyle(el);
      if (cs.display !== "flex" && cs.display !== "inline-flex") continue;
      var dir = cs.flexDirection, col = dir.indexOf("column") === 0, rev = dir.indexOf("reverse") > 0;
      var g = parseFloat(col ? cs.rowGap : cs.columnGap) || 0;
      if (!g) continue;
      var prop = col ? (rev ? "marginBottom" : "marginTop") : (rev ? "marginRight" : "marginLeft");
      var css = prop.replace(/[A-Z]/g, function (m) { return "-" + m.toLowerCase(); });
      var first = true;
      for (var c = el.firstElementChild; c; c = c.nextElementSibling) {
        var ccs = getComputedStyle(c);
        if (ccs.display === "none" || ccs.position === "absolute" || ccs.position === "fixed") continue;
        var mine = c.getAttribute("data-gapfix") === prop;
        if (first) {
          if (mine) { c.style[prop] = ""; c.removeAttribute("data-gapfix"); }
          first = false;
        } else if (mine || (parseFloat(ccs.getPropertyValue(css)) || 0) === 0) {
          if (c.style[prop] !== g + "px") c.style[prop] = g + "px";
          c.setAttribute("data-gapfix", prop);
        }
      }
    }
  }
  function start() {
    if (supported()) return;
    var busy = 0;
    var later = function () { clearTimeout(busy); busy = setTimeout(fix, 60); };
    fix();
    new MutationObserver(later).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "hidden"] });
    window.addEventListener("resize", later);
  }
  if (document.body) start(); else document.addEventListener("DOMContentLoaded", start);
})();
</script>
</body>
</html>
