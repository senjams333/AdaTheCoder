{% extends "base.html" %}
{% block title %}Something went wrong | Ada The Coder{% endblock %}
{% block content %}
<section class="auth wrap">
  <div class="auth-card">
    <img class="error-art" src="{{ url_for('static', filename='img/byte.webp') }}" alt="">
    <h1>{% if code == 404 %}Page not found{% else %}That didn't work{% endif %}</h1>
    <p>{{ message }}</p>
    <a class="btn" href="{{ url_for('index') }}">Go to the home page</a>
  </div>
</section>
{% endblock %}
